[package]
name = "maestro-graphql-schema"
version = "0.1.0"
edition = "2021"
description = "Core GraphQL schema types (Block, Event, Extrinsic) for building typed clients against Maestro indexer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/allfeat/indexer"
keywords = ["graphql", "blockchain", "substrate", "indexer"]
categories = ["api-bindings", "web-programming"]

[dependencies]
async-graphql = { version = "7.0", default-features = false, features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
